[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teach-to-game"
version = "0.1.0"
description = "A local app for watching reinforcement-learning agents learn games"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=2.0",
    "pygame>=2.5",
    "stable-baselines3>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx2>=0.1",
]

[tool.setuptools.packages.find]
include = ["learner", "games", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
